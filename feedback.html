<head>

    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/feedback.css">
</head>
<body>
    <div class="wrapper">
<header class="firstblock container">
    <div class="header-content">
        <a href="index.html"><img src="./img/header/logo.png" alt="Farmzi Logo" class="logo"></a>

        <button class="mobile-menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav">
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="feedback.html" id="feedbackLink" style="display: none;">Отзывы</a></li>
                <li><a href="admin.html" id="adminLink" style="display: none;">Админ-панель</a></li>
                <li><a href="login.html" id="loginLink">Войти</a></li>
                <li><a href="auth.html" id="registerLink">Регистрация</a></li>
            </ul>
        </nav>
        
        <div class="user-menu" id="userMenu" style="display: none;">
            <div class="user-avatar" id="userAvatar">Г</div>
            <div class="user-dropdown" id="userDropdown">
                <a href="profile.html">Профиль</a>
                <a href="orders.html">Мои заказы</a>
                <a href="#" class="logout-btn" onclick="logout()">Выйти</a>
            </div>
        </div>
        
        <div class="header-contact">
            <h2>Позвоните нам:</h2>
            <h2>+00 89 458 648</h2>
        </div>
    </div>
</header>

        <section class="feedback-container">
            <h2 class="section-title">Оставить отзыв</h2>
            
            <div class="feedback-form">
                <form id="feedbackForm">
                    <div class="form-group">
                        <label>Выберите товар *</label>
                        <select id="productSelect" required>
                            <option value="">-- Выберите товар --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Оценка *</label>
                        <div class="rating-stars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" id="rating" required>
                    </div>

                    <div class="form-group">
                        <label>Отзыв *</label>
                        <textarea id="comment" placeholder="Минимум 50 символов" minlength="50" required></textarea>
                        <span class="char-count">0/50 символов</span>
                    </div>

                    <button type="submit" id="submitFeedback" disabled>Отправить отзыв</button>
                </form>
            </div>
        </section>
    </div>

    <script src="./js/feedback.js"></script>
        <script src="./js/user.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateNavigation();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof updateNavigation === 'function') {
                updateNavigation();
            }
        });
    </script>
</body>
</html>
