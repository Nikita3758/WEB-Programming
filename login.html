<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmzi - Вход</title>
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/auth.css">
</head>
<body>
    <div class="wrapper">
        <header class="firstblock container">
            <div class="header-content">
                <img src="./img/header/logo.png" alt="Farmzi Logo" class="logo">

                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <nav class="nav">
                    <ul class="nav-menu">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="catalog.html">Catalog</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="favorites.html">Favorites</a></li>
                        <li><a href="feedback.html">FeedBack</a></li>
                        <li><a href="auth.html">Reg</a></li>
                    </ul>
                </nav>
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar">Г</div>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="profile.html">Профиль</a>
                        <a href="orders.html">Мои заказы</a>
                        <a href="#" class="logout-btn" onclick="logout()">Выйти</a>
                    </div>
                </div>
                <div class="header-contact">
                    <h2>Call us:</h2>
                    <h2>+00 89 458 648</h2>
                </div>
            </div>
        </header>

        <section class="auth-container">
            <div class="auth-form">
                <h2 class="section-title">Вход в систему</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email или телефон *</label>
                        <input type="text" id="login" placeholder="Email или телефон" required>
                        <span class="error-message" id="loginError"></span>
                    </div>

                    <div class="form-group">
                        <label>Пароль *</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Запомнить меня</span>
                        </label>
                    </div>

                    <button type="submit" id="loginBtn">Войти</button>
                </form>

                <p class="auth-switch">
                    Нет аккаунта? <a href="auth.html">Зарегистрироваться</a>
                </p>

                <div class="auth-links">
                    <a href="#" id="forgotPassword">Забыли пароль?</a>
                </div>
            </div>
        </section>

        <!-- Модальное окно восстановления пароля -->
        <div id="passwordModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Восстановление пароля</h3>
                <form id="passwordRecoveryForm">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="recoveryEmail" required>
                        <span class="error-message" id="recoveryError"></span>
                    </div>
                    <button type="submit">Отправить ссылку</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/login.js"></script>
</body>
</html>
